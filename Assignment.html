<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Grade Management System</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#2563eb; --danger:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --line:#374151; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:18px 20px; }
  header h1 { margin:0; font-size:1.3rem; }
  header p { margin:4px 0 0; font-size:.85rem; opacity:.9; }
  main { max-width:900px; margin:20px auto; padding:0 14px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { margin:0 0 12px; font-size:1.05rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:130px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--primary); color:#fff; cursor:pointer; font-weight:600; }
  button.secondary { background:var(--muted); }
  button.danger { background:var(--danger); padding:6px 10px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:.8rem; text-transform:uppercase; }
  #msg { min-height:1.2em; font-size:.9rem; margin-top:8px; }
  .err { color:var(--danger); } .ok { color:#16a34a; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:var(--bg); border-radius:8px; padding:12px; }
  .stat b { display:block; font-size:1.2rem; }
  .stat span { color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>Student Grade Management System</h1>
  <p>Data structure used: Arrays (names[] and scores[])</p>
</header>

<main>
  <section class="card">
    <h2>Add / Update Student</h2>
    <div class="row">
      <input id="name" placeholder="Student name">
      <input id="score" type="number" min="0" max="100" placeholder="Score (0-100)">
      <button onclick="addStudent()">Add</button>
      <button class="secondary" onclick="updateStudent()">Update score</button>
    </div>
    <div id="msg"></div>
  </section>

  <section class="card">
    <h2>Search</h2>
    <div class="row">
      <input id="searchName" placeholder="Search by name">
      <button onclick="searchStudent()">Search</button>
    </div>
    <div id="searchResult" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Students</h2>
      <button class="secondary" onclick="sortStudents()">Sort by score (high to low)</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Grade</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Statistics</h2>
    <div class="stats" id="stats"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  function say(text, ok) {
    $("msg").textContent = text;
    $("msg").className = ok ? "ok" : "err";
  }

  // ---------- Browser fallback (used only when the Node server is not running) ----------
  // Same arrays and same algorithms as server.js
  const names = [];
  const scores = [];
  let useLocal = false;

  function gradeOf(s) {
    if (s >= 80) return "A";
    if (s >= 70) return "B";
    if (s >= 60) return "C";
    if (s >= 50) return "D";
    return "F";
  }

  function listLocal() {
    const out = [];
    for (let i = 0; i < names.length; i++) {
      out.push({ name: names[i], score: scores[i], grade: gradeOf(scores[i]) });
    }
    return out;
  }

  function searchLocal(name) {
    for (let i = 0; i < names.length; i++) {
      if (names[i].toLowerCase() === name.toLowerCase()) return i;
    }
    return -1;
  }

  function localApi(url, method, body) {
    const u = new URL(url, "http://local");
    const p = u.pathname;
    body = body || {};

    if (method === "GET" && p === "/api/students") return listLocal();

    if (method === "GET" && p === "/api/stats") {
      if (scores.length === 0) return null;
      let total = 0, hi = 0, lo = 0;
      for (let i = 0; i < scores.length; i++) {
        total += scores[i];
        if (scores[i] > scores[hi]) hi = i;
        if (scores[i] < scores[lo]) lo = i;
      }
      return {
        average: +(total / scores.length).toFixed(2),
        highest: { name: names[hi], score: scores[hi] },
        lowest: { name: names[lo], score: scores[lo] },
        count: scores.length,
      };
    }

    if (method === "GET" && p === "/api/search") {
      const i = searchLocal(u.searchParams.get("name") || "");
      if (i === -1) throw new Error("Student not found");
      return { name: names[i], score: scores[i], grade: gradeOf(scores[i]) };
    }

    if (method === "POST" && p === "/api/students") {
      const s = Number(body.score);
      if (!body.name || !body.name.trim() || isNaN(s) || s < 0 || s > 100)
        throw new Error("Enter a name and a score from 0 to 100");
      names.push(body.name.trim());
      scores.push(s);
      return listLocal();
    }

    if (method === "POST" && p === "/api/sort") {
      const n = scores.length;
      for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - i - 1; j++) {
          if (scores[j] < scores[j + 1]) {
            [scores[j], scores[j + 1]] = [scores[j + 1], scores[j]];
            [names[j], names[j + 1]] = [names[j + 1], names[j]];
          }
        }
      }
      return listLocal();
    }

    if (method === "PUT" && p === "/api/students") {
      const s = Number(body.score);
      const i = searchLocal(body.name || "");
      if (i === -1) throw new Error("Student not found");
      if (isNaN(s) || s < 0 || s > 100) throw new Error("Invalid score");
      scores[i] = s;
      return listLocal();
    }

    if (method === "DELETE" && p === "/api/students") {
      const i = searchLocal(u.searchParams.get("name") || "");
      if (i === -1) throw new Error("Student not found");
      names.splice(i, 1);
      scores.splice(i, 1);
      return listLocal();
    }

    throw new Error("Not found");
  }

  async function api(url, method = "GET", body) {
    if (!useLocal) {
      let res, data;
      try {
        res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        data = await res.json();
      } catch (e) {
        // No Node server (or the reply was not JSON) -> use browser arrays instead
        useLocal = true;
        document.querySelector("header p").textContent =
          "Data structure used: Arrays (names[] and scores[]) | Browser mode (Node server not running)";
      }
      if (!useLocal) {
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
      }
    }
    return localApi(url, method, body);
  }

  function render(students) {
    const rows = $("rows");
    rows.innerHTML = "";
    if (students.length === 0) {
      rows.innerHTML = '<tr><td colspan="5">No students yet.</td></tr>';
    }
    students.forEach((s, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${i + 1}</td><td></td><td>${s.score}</td><td>${s.grade}</td><td></td>`;
      tr.children[1].textContent = s.name;          // safe from HTML injection
      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "Delete";
      del.onclick = () => deleteStudent(s.name);
      tr.children[4].appendChild(del);
      rows.appendChild(tr);
    });
    loadStats();
  }

  async function loadStats() {
    const st = await api("/api/stats");
    $("stats").innerHTML = st
      ? `<div class="stat"><b>${st.count}</b><span>Students</span></div>
         <div class="stat"><b>${st.average}</b><span>Average</span></div>
         <div class="stat"><b>${st.highest.score}</b><span>Highest (${esc(st.highest.name)})</span></div>
         <div class="stat"><b>${st.lowest.score}</b><span>Lowest (${esc(st.lowest.name)})</span></div>`
      : "<span>No data yet.</span>";
  }

  function esc(t) {
    const d = document.createElement("div");
    d.textContent = t;
    return d.innerHTML;
  }

  async function load() { render(await api("/api/students")); }

  async function addStudent() {
    try {
      render(await api("/api/students", "POST", { name: $("name").value, score: $("score").value }));
      say("Student added.", true);
      $("name").value = ""; $("score").value = "";
    } catch (e) { say(e.message, false); }
  }

  async function updateStudent() {
    try {
      render(await api("/api/students", "PUT", { name: $("name").value, score: $("score").value }));
      say("Score updated.", true);
    } catch (e) { say(e.message, false); }
  }

  async function deleteStudent(name) {
    try {
      render(await api("/api/students?name=" + encodeURIComponent(name), "DELETE"));
      say("Student deleted.", true);
    } catch (e) { say(e.message, false); }
  }

  async function sortStudents() { render(await api("/api/sort", "POST")); }

  async function searchStudent() {
    try {
      const s = await api("/api/search?name=" + encodeURIComponent($("searchName").value));
      $("searchResult").textContent = `${s.name} - ${s.score} (Grade ${s.grade})`;
    } catch (e) { $("searchResult").textContent = e.message; }
  }

  load();
</script>
</body>
</html>
